version: '3.8'

services:
  # PostgreSQL relational database
  db:
    image: postgres:15-alpine
    container_name: codejudge-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: codejudge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis instance for BullMQ and API caching
  redis:
    image: redis:7-alpine
    container_name: codejudge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NestJS API gateway
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codejudge-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@db:5432/codejudge?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=5000
      - JWT_SECRET=your-super-secret-access-token-key-change-in-production-19827389
      - JWT_REFRESH_SECRET=your-super-secret-refresh-token-key-change-in-production-129837192
      - FRONTEND_URL=http://localhost
    ports:
      - "5000:5000"

  # BullMQ Sandboxed worker
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: codejudge-worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # DooD: Connect to host Docker daemon to spin up compile sandboxes
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared workspace mount for temp submissions file writes
      - temp_volume:/code/temp
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@db:5432/codejudge?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # Next.js frontend web app
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codejudge-frontend
    restart: always
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
    ports:
      - "3000:3000"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: codejudge-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api

volumes:
  postgres_data:
  redis_data:
  # Named volume for writing codes temporarily
  temp_volume:
    driver: local
